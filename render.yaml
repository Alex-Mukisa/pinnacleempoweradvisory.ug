services:
  - type: web
    name: pinnacle-empower-advisory
    runtime: node
    plan: starter
    domains:
      - pinnacleempoweradvisory.ug
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: pinnacle-assistant-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 26.7.0
      - key: DATABASE_PATH
        value: /var/data/pinnacle.sqlite
      - key: CONTACT_EMAIL
        value: pinnacleempoweradvisory@gmail.com
      - key: AI_API_KEY
        sync: false
      - key: AI_API_URL
        value: https://api.openai.com/v1/chat/completions
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
